repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        types_or: [c, c++]
        args: [--style=file]

  - repo: local
    hooks:
      - id: clang-tidy
        name: clang-tidy
        entry: bash -c 'if [ -f build/debug/compile_commands.json ]; then clang-tidy --quiet -p build/debug "$@"; else echo "Skipping clang-tidy (no compile_commands.json, run make build first)"; fi'
        language: system
        types_or: [c, c++]
        stages: [pre-commit]
